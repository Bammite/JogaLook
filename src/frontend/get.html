<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documents Uploadés</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    .container {
      width: 100%;
      max-width: 800px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #f8fafc;
    }
    .btn-new {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #0f172a;
      background: #38bdf8;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn-new:hover {
      background: #7dd3fc;
    }
    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
      border: 1px solid #334155;
    }
    .search-box {
      margin-bottom: 20px;
    }
    .search-box input {
      width: 100%;
      padding: 12px 16px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f8fafc;
      font-size: 0.95rem;
      outline: none;
    }
    .search-box input:focus {
      border-color: #38bdf8;
    }
    .file-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .file-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: #0f172a80;
      border: 1px solid #334155;
      border-radius: 10px;
      transition: all 0.2s;
    }
    .file-row:hover {
      border-color: #475569;
      background: #0f172a;
    }
    .file-details {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }
    .file-icon {
      font-size: 1.6rem;
      flex-shrink: 0;
    }
    .file-info {
      min-width: 0;
    }
    .file-name {
      font-size: 1rem;
      font-weight: 500;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }
    .file-meta {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 2px;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .btn-download {
      padding: 8px 14px;
      font-size: 0.85rem;
      background: #0284c7;
      color: #fff;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 500;
      transition: background 0.2s;
    }
    .btn-download:hover {
      background: #0369a1;
    }
    .btn-view {
      padding: 8px 14px;
      font-size: 0.85rem;
      background: #334155;
      color: #cbd5e1;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 500;
      transition: background 0.2s;
    }
    .btn-view:hover {
      background: #475569;
      color: #fff;
    }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #94a3b8;
    }
    .empty-state svg {
      width: 48px;
      height: 48px;
      margin-bottom: 12px;
      stroke: #64748b;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>📥 Documents Uploadés</h1>
        <p style="color: #94a3b8; font-size: 0.9rem; margin-top: 4px;">Accès libre et sans mot de passe</p>
      </div>
      <a href="/upload" class="btn-new">➕ Uploader un document</a>
    </div>

    <div class="card">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Rechercher un fichier par son nom..." />
      </div>

      <div class="file-list" id="fileList">
        <div class="empty-state">Chargement des fichiers...</div>
      </div>
    </div>
  </div>

  <script>
    const fileList = document.getElementById('fileList');
    const searchInput = document.getElementById('searchInput');
    let allFiles = [];

    function formatBytes(bytes, decimals = 2) {
      if (!bytes || bytes === 0) return '0 B';
      const k = 1024;
      const dm = decimals < 0 ? 0 : decimals;
      const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      return d.toLocaleDateString('fr-FR', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function getFileIcon(filename) {
      const ext = filename.split('.').pop().toLowerCase();
      if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg'].includes(ext)) return '🖼️';
      if (['pdf'].includes(ext)) return '📕';
      if (['zip', 'rar', '7z', 'tar', 'gz'].includes(ext)) return '📦';
      if (['doc', 'docx', 'odt'].includes(ext)) return '📝';
      if (['xls', 'xlsx', 'csv'].includes(ext)) return '📊';
      if (['mp3', 'wav', 'ogg'].includes(ext)) return '🎵';
      if (['mp4', 'mkv', 'avi', 'mov'].includes(ext)) return '🎬';
      if (['txt', 'md', 'json', 'js', 'html', 'css'].includes(ext)) return '📄';
      return '📁';
    }

    async function loadFiles() {
      try {
        const res = await fetch('/api/documents');
        const data = await res.json();
        if (data.success) {
          allFiles = data.files;
          renderFiles(allFiles);
        } else {
          fileList.innerHTML = `<div class="empty-state">Erreur : ${data.message}</div>`;
        }
      } catch (err) {
        fileList.innerHTML = `<div class="empty-state">Erreur de chargement des fichiers.</div>`;
      }
    }

    function renderFiles(files) {
      if (!files || files.length === 0) {
        fileList.innerHTML = `
          <div class="empty-state">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
            </svg>
            <p>Aucun document trouvé.</p>
          </div>
        `;
        return;
      }

      fileList.innerHTML = '';
      files.forEach(file => {
        const row = document.createElement('div');
        row.className = 'file-row';

        const downloadUrl = `/get/download/${encodeURIComponent(file.storedName)}`;
        const viewUrl = `/get/view/${encodeURIComponent(file.storedName)}`;

        row.innerHTML = `
          <div class="file-details">
            <div class="file-icon">${getFileIcon(file.originalName)}</div>
            <div class="file-info">
              <span class="file-name" title="${file.originalName}">${file.originalName}</span>
              <div class="file-meta">
                ${formatBytes(file.size)} • ${formatDate(file.createdAt)}
              </div>
            </div>
          </div>
          <div class="actions">
            <a href="${viewUrl}" target="_blank" class="btn-view">Ouvrir</a>
            <a href="${downloadUrl}" class="btn-download" download="${file.originalName}">Télécharger</a>
          </div>
        `;
        fileList.appendChild(row);
      });
    }

    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) {
        renderFiles(allFiles);
        return;
      }
      const filtered = allFiles.filter(f => f.originalName.toLowerCase().includes(q));
      renderFiles(filtered);
    });

    loadFiles();
  </script>
</body>
</html>
