<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Hors-Jeu ! — JogaLook</title>
    <meta name="description" content="Cette page est sortie du terrain. Retournez sur la boutique JogaLook pour découvrir nos maillots de sport authentiques.">
    
    <!-- Favicon JogaLook -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="alternate icon" href="/favicon.svg">
    <link rel="shortcut icon" href="/favicon.svg">
    
    <!-- Polices Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #f15a24;
            --primary-glow: rgba(241, 90, 36, 0.4);
            --primary-hover: #ff6b35;
            --dark-bg: #070c1a;
            --card-bg: rgba(15, 23, 42, 0.75);
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(241, 90, 36, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            padding: 1.5rem;
            -webkit-font-smoothing: antialiased;
        }

        /* Ambiance Stade & Lumieres */
        .stadium-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(241, 90, 36, 0.12) 0%, rgba(11, 19, 41, 0.05) 50%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
            animation: pulseGlow 6s ease-in-out infinite alternate;
        }

        .ambient-light-1 {
            position: absolute;
            top: 10%;
            left: 15%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.06) 0%, transparent 70%);
            pointer-events: none;
        }

        .ambient-light-2 {
            position: absolute;
            bottom: 10%;
            right: 15%;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(241, 90, 36, 0.08) 0%, transparent 70%);
            pointer-events: none;
        }

        /* Lignes de terrain de football subtiles */
        .pitch-lines {
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(circle at center, transparent 150px, rgba(255, 255, 255, 0.015) 151px, transparent 152px),
                linear-gradient(to right, transparent 49.8%, rgba(255, 255, 255, 0.02) 50%, transparent 50.2%);
            pointer-events: none;
            z-index: 0;
        }

        /* Carte Principale 404 */
        .error-card {
            position: relative;
            z-index: 1;
            max-width: 580px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 3.5rem 2.5rem;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
            animation: cardEntrance 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Logo discret */
        .brand-emblem {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.15rem;
            font-weight: 800;
            margin-bottom: 2rem;
            letter-spacing: -0.3px;
            transition: transform 0.2s ease;
        }

        .brand-emblem:hover {
            transform: scale(1.03);
        }

        .brand-emblem svg {
            width: 26px;
            height: 26px;
        }

        .brand-emblem span {
            color: var(--primary);
        }

        /* Badge d'arbitrage */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(241, 90, 36, 0.12);
            border: 1px solid rgba(241, 90, 36, 0.3);
            color: #ff8c5a;
            padding: 0.4rem 1rem;
            border-radius: 9999px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.82rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 1.5rem;
        }

        .status-badge .dot {
            width: 6px;
            height: 6px;
            background-color: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--primary);
            animation: blinkDot 1.5s infinite;
        }

        /* Grand chiffre 404 stylisé */
        .error-code {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 6.5rem;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -3px;
            margin-bottom: 0.75rem;
            background: linear-gradient(135deg, #ffffff 30%, #94a3b8 70%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.25rem;
        }

        .error-code .ball-icon {
            display: inline-block;
            animation: bounceBall 2.5s infinite ease-in-out;
            transform-origin: bottom center;
            filter: drop-shadow(0 0 12px var(--primary-glow));
        }

        /* Titre & Description */
        h1 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.65rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 0.85rem;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 1rem;
            color: var(--text-muted);
            line-height: 1.65;
            margin-bottom: 2.25rem;
        }

        /* Actions */
        .actions-group {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        .btn {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.96rem;
            font-weight: 700;
            padding: 0.95rem 1.6rem;
            border-radius: 12px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }

        .btn-primary {
            background-color: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 15px var(--primary-glow), 0 1px 2px rgba(0, 0, 0, 0.2);
            border: 1px solid transparent;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(241, 90, 36, 0.5);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--border-hover);
            transform: translateY(-2px);
        }

        .btn-link {
            background: transparent;
            color: var(--text-muted);
            font-size: 0.88rem;
            padding: 0.5rem;
        }

        .btn-link:hover {
            color: #ffffff;
        }

        /* Animations */
        @keyframes cardEntrance {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes pulseGlow {
            0% {
                transform: translate(-50%, -50%) scale(0.9);
                opacity: 0.7;
            }
            100% {
                transform: translate(-50%, -50%) scale(1.15);
                opacity: 1;
            }
        }

        @keyframes bounceBall {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-14px) rotate(180deg);
            }
        }

        @keyframes blinkDot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @media (max-width: 480px) {
            .error-card {
                padding: 2.5rem 1.5rem;
            }
            .error-code {
                font-size: 5rem;
            }
            h1 {
                font-size: 1.4rem;
            }
            p {
                font-size: 0.92rem;
            }
        }
    </style>
</head>
<body>

    <!-- Arrière-plan ambiance stade -->
    <div class="stadium-glow"></div>
    <div class="ambient-light-1"></div>
    <div class="ambient-light-2"></div>
    <div class="pitch-lines"></div>

    <!-- Carte Centrale -->
    <main class="error-card">
        
        <!-- Logo JogaLook -->
        <a href="/" class="brand-emblem" aria-label="Retour à l'accueil JogaLook">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="24" cy="24" r="24" fill="#0b1329"/>
                <path d="M10 14 L14 10 L18 13 C19.5 14 20.5 14 24 14 C27.5 14 28.5 14 30 13 L34 10 L38 14 L33 18 L33 38 L15 38 L15 18 Z" fill="#f15a24"/>
                <path d="M20 14 Q24 17 28 14" stroke="#0b1329" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            </svg>
            Joga<span>Look</span>
        </a>

        <!-- Badge -->
        <div>
            <div class="status-badge">
                <span class="dot"></span>
                Drapeau levé &bull; Hors-jeu
            </div>
        </div>

        <!-- Chiffre 404 avec ballon animé -->
        <div class="error-code" aria-label="Erreur 404">
            <span>4</span>
            <span class="ball-icon">⚽</span>
            <span>4</span>
        </div>

        <!-- Titre & Message -->
        <h1>Oups, cette page est sortie du terrain !</h1>
        <p>
            Le maillot, la collection ou le lien que vous recherchez n'est plus en jeu ou a changé de position.
        </p>

        <!-- Boutons d'action -->
        <div class="actions-group">
            <a href="/" class="btn btn-primary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                Retour au terrain (Accueil)
            </a>
            
            <a href="/catalog" class="btn btn-secondary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                    <polyline points="2 17 12 22 22 17"></polyline>
                    <polyline points="2 12 12 17 22 12"></polyline>
                </svg>
                Explorer nos maillots
            </a>

            <a href="/contact" class="btn btn-link">
                Besoin d'aide ? Contactez notre support →
            </a>
        </div>

    </main>

</body>
</html>
